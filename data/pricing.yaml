      [가정값 — 근거 전무. 민감도 분석 최우선 대상]
      상용은 벤더가 축적한 탐지룰을 제공하나 자체 구축은 직접 개발해야 함.
      본 항목은 5개 공수 중 유일하게 간접 근거조차 없으므로, 결론이 이 값에 얼마나
      민감한지를 Phase 6에서 가장 먼저 확인해야 함.
      범위를 6배(3~18)로 가장 넓게 잡은 이유가 이것.
      탐지 품질·실효성 확보 기간 등 금액으로 환산되지 않는 측면은 Phase 7에서 정성적으로 별도 서술.

