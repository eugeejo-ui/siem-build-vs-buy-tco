      EPS 기준(GB/day) 방식을 쓰지 않는 이유: GB->EPS->GB 왕복 환산은 로그 소스 구성에 따라
      결과를 30~50% 왜곡시킨다는 경고가 다수 출처에서 확인됨. 본 프로젝트는 GB/day를
