# 3. 저장 계수 (Phase 3.5 신설 예정 — 현재 미검증)
#    로그량을 실제 디스크 용량으로 바꾸는 계수입니다.
#    용량 = 일일 로그량 × 보존일수 × 계수
# -----------------------------------------------------------------------------
storage_factor:

  coeff_rawdata:
    name: "원본(rawdata) 계수 — RF 적용 대상"
    low: null
    base: 0.15
    high: null
    unit: "ratio"
    status: confirmed
    confidence: vendor
    source: "Splunk 공식 문서 Estimate your storage requirements"
    source_url: "https://help.splunk.com/en/splunk-enterprise/get-started/deployment-capacity-manual/10.4/hardware-capacity-planning/estimate-your-storage-requirements"
    retrieved: "2026-09-02"
    note: "복제 시 RF가 곱해지는 대상."

  coeff_tsidx:
    name: "색인(tsidx) 계수 — SF 적용 대상"
    low: null
    base: 0.35
    high: null
    unit: "ratio"
    status: confirmed
    confidence: vendor
    source: "Splunk 공식 문서 Estimate your storage requirements"
    source_url: "https://help.splunk.com/en/splunk-enterprise/get-started/deployment-capacity-manual/10.4/hardware-capacity-planning/estimate-your-storage-requirements"
    retrieved: "2026-09-02"
    note: "rawdata+tsidx=0.50 (hot/warm/cold). 복제 시 SF가 곱해지는 대상."

  coeff_frozen:
    name: "frozen 계층 용량 계수"
    low: null
    base: 0.15
    high: null
    unit: "ratio"
    status: confirmed
    confidence: vendor
    source: "Splunk 공식 문서 Archive indexed data"
    source_url: "https://help.splunk.com/en/splunk-enterprise/administer/manage-indexers-and-indexer-clusters/9.0/indexing-overview/back-up-and-archive-your-indexes/archive-indexed-data"
    retrieved: "2026-09-02"
    note: "색인(tsidx) 제거, rawdata만 보관."

  elastic_overhead:
    name: "자체구축(Elastic/Wazuh) 저장 오버헤드 계수"
    low: null
    base: 1.15
    high: null
    unit: "ratio"
    applies_to: [self_hosted, self_hosted_tiered]
    status: confirmed
    confidence: vendor
    source: >
      원본 대비 인덱스 크기: Elastic 사이징 블로그 약 1.1(2018)·관측 평균 1.2(2020),
      AWS OpenSearch Service "흔히 원본의 약 110%". 1.15는 그 중간값.
      로컬 용량 = 일일량 × 로컬 보존일 × (1+복제본) × 1.15, 오브젝트 용량 = 일일량 × 오브젝트 보존일 × 1.15.
    source_url: "https://www.elastic.co/blog/benchmarking-and-sizing-your-elasticsearch-cluster-for-logs-and-metrics"
    source_url_2: "https://docs.aws.amazon.com/opensearch-service/latest/developerguide/bp-storage.html"
    retrieved: "2026-09-16"
    note: >
      [경로 분리 필수] Splunk 계수(0.15/0.35)와 계산 체계가 정반대이므로 혼용 금지.
      Splunk는 압축돼 원본보다 작아지고(0.5배), Elastic은 오버헤드가 붙어 커진다(1.15배).
      src/storage_model.py의 compute_storage_elastic()로 별도 구현. 작업원칙 10항.
      [2026-09-16 정정] 종전 source는 "Lucene 1.1~1.2 + translog 1.05의 합"이라고 적었으나,
      translog는 샤드당 flush 임계값으로 상한이 있어 보존 기간에 비례하지 않는다. 값은 공식 범위 안이라 유지.
      디스크 여유 공간은 이 계수에 넣지 않고 disk_headroom_factor로 따로 적용한다.

  selfhosted_compression_saving:
    name: "자체구축 압축 설정에 따른 용량 절감률"
    low: 0
    base: 0
    high: 20
    unit: "%"
    applies_to: [self_hosted, self_hosted_tiered]
    status: assumed
    confidence: vendor
    source: >
      best_compression 코덱(무료판 사용 가능)은 기본 대비 15~25% 절감(Elastic 2015년 블로그, 오래된 글로 표시됨).
      OpenSearch zstd·best_compression은 비로그 벤치마크에서 30~35% 절감.
      logsdb 모드의 최대 65% 절감은 핵심 기능(synthetic _source)이 Enterprise 전용이라 제외.
    source_url: "https://docs.opensearch.org/latest/im-plugin/index-codecs/"
    retrieved: "2026-09-16"
    note: >
      [가정 선택 — 원 프로젝트 검증 D3] 보안 로그 전용 공식 비율이 없어 기본 0, 상한 20%로 민감도 처리.

  smartstore_remote_full_search:
    name: "SmartStore 원격 전 기간 검색 가능 유지 여부"
    low: null
    base: 0
    high: 1
    unit: "boolean (0=표준 수명주기, 1=전기간 검색가능)"
    applies_to: [splunk_smartstore]
    status: assumed
    confidence: assumption
    source: >
      Splunk 공식 문서에 SmartStore가 frozen 정책을 면제한다는 근거는 없다.
      SmartStore가 바꾸는 것은 "warm 버킷을 어디에 저장하는가"(로컬→원격)이며,
      hot→warm→frozen 수명주기 자체는 동일하게 적용된다.
      따라서 base=0(표준 수명주기, frozen은 0.15 계수)이 기본이다.
    source_url: "https://help.splunk.com/en/splunk-enterprise/administer/manage-indexers-and-indexer-clusters/9.1/implement-smartstore-to-reduce-local-storage-requirements/smartstore-architecture-overview"
    retrieved: "2026-09-03"
    note: >
      [옵션 파라미터] high=1로 켜면 전 보존기간을 검색 가능 상태(0.5 계수)로 원격 유지.
      ISMS 심사 조회 요구 등으로 오래된 접속기록도 즉시 검색해야 하는 조직의 시나리오.
      단 이 옵션을 켠 결과를 일반 Splunk와 총액만으로 비교하면 안 된다.
      일반 Splunk는 frozen에서 색인을 버려 그 구간 검색이 불가능하므로
      제공 기능이 달라지기 때문. Phase 8 서술 시 이 차이를 명시할 것.

  smartstore_cache_days:
    name: "SmartStore 로컬 캐시 보존일"
    low: 7
    base: 14
    high: 30
    unit: "days"
    applies_to: [splunk_smartstore]
    status: assumed
    confidence: assumption
    source: >
      [구조는 공식 확인, 일수는 가정] Splunk 공식 문서:
      hot 버킷은 로컬에 생성되고, warm으로 롤되면 원격 오브젝트 스토어로 복사된 뒤
      로컬 캐시에서 축출(evict) 대상이 된다. 캐시에는 hot 버킷과
      "현재 검색에 참여 중이거나 최근 생성·검색된 warm 버킷"만 남는다.
      캐시 크기 산식(커뮤니티): Global Cache = 일일수집량 x 압축률 x RF x 캐시보존일.
      다만 실제 캐시 보존일은 검색 패턴·디스크 여유에 따라 달라지므로 가정값으로 둔다.
    source_url: "https://help.splunk.com/en/splunk-enterprise/administer/manage-indexers-and-indexer-clusters/9.1/implement-smartstore-to-reduce-local-storage-requirements/smartstore-architecture-overview"
    source_url_2: "https://community.splunk.com/t5/Deployment-Architecture/Smartstore-How-to-calculate-storage-requirements-for-indexer/m-p/439249"
    retrieved: "2026-09-03"
    note: >
      [민감도 대상] 이 값이 작을수록 로컬 SSD 부담이 줄고 오브젝트 비중이 커진다.
      즉 SmartStore의 경제성을 직접 좌우하는 파라미터.
      hot/warm 보존일(30일)보다 짧게 설정해야 티어링 효과가 나타난다.

  smartstore_local_replication:
    name: "SmartStore 로컬 캐시 복제 계수"
    low: 1
    base: 1
    high: 2
    unit: "count"
    applies_to: [splunk_smartstore]
    status: partial
    confidence: vendor
    source: >
      Splunk 공식 문서: warm 버킷이 원격 스토어로 업로드되면 "대상 인덱서들은
      자신의 복사본을 삭제한다. 원격 스토어가 여러 로컬 복사본 유지 없이도
      고가용성을 보장하기 때문". 마스터 복사본은 원격에 존재.
      즉 warm 이후 구간에서 로컬 RF 부담이 사라지는 것이 SmartStore의 핵심 판매 논리.
      단 Splunk 8.0+ 는 성능상 축출 전까지 RF 수만큼 캐시에 유지한다는 커뮤니티 지적이 있어
      high=2로 여지를 둔다.
