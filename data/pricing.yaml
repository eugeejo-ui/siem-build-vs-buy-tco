    source: >
      [해외 정가 앵커] Splunk Cloud 인제스트 과금. 제3자 레이트카드 분석(2026-07 갱신):
      50GB/day 구간 약 $1,000/GB/day/년, 한자릿수 GB 구간 $1,620까지 상승,
      초대량 구간 $750 이하로 하락. 별도 출처는 정가 $150~200/GB/day(=연 환산 유사 대역) 제시.
      Splunk 공식 FAQ도 "1GB/day에서 100GB/day로 늘면 GB당 단가가 50% 이상 하락"한다고 명시,
      볼륨 체감 구조 자체는 공식 확인됨.
    source_url: "https://siemcostcalculator.com/splunk-pricing"
    source_url_2: "https://www.splunk.com/en_us/products/pricing/faqs/enterprise-and-cloud.html"
    source_url_3: "https://monitoringcost.com/splunk-pricing"
    retrieved: "2026-09-03"
    note: >
      [해외 정가 앵커 — 국내가 아님. 역산 대상]
      Splunk는 per-GB 목록가를 공개하지 않으므로 위 값은 제3자 종합 추정.
      단위: USD/GB-day/year (일일 1GB를 1년간 인덱싱할 때의 연간 비용).
      본 값은 ES 가산율(splunk_es_uplift) 적용 전 기본 인제스트가.
      [주의 1] 실계약은 정가 대비 25~55%(대량은 40~70%) 할인이 일반적 → 민감도 대상.
      [주의 2] 볼륨 체감 구조가 있어 단일 단가로 전 구간을 계산하면 소량 구간은 과소,
              대량 구간은 과대 산정됨. low/base/high가 각각 대량/중간/소량 구간에 대응.
      [주의 3] 국내가는 지침 제17조 등으로 비공개. 위 값을 국내가로 쓰지 말고
              "국내가가 이 수준 이하면 유리한가" 형태의 역산 앵커로만 사용.
      단일 값으로 확정하지 않고 "얼마 이하이면 유리한가" 형태의 역산으로 처리.

