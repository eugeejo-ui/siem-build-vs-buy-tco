      노드당 샤드 상한 1,000개, 권장 샤드 크기 10~50GB.
      디스크 사용률은 워터마크 회피를 위해 75~80% 이하 유지 권장.
      base=20TB x 0.75(사용률 상한), low=검색 부하 있는 warm 노드, high=순수 보관 cold 노드 상한.
