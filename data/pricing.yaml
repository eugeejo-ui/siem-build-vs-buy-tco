  managed_siem:
    name: "관리형 SIEM 서비스 요금"
    low: 2.96
    base: 4.30
    high: 5.59
    unit: "USD/GB (해외 앵커)"
    applies_to: [managed_siem]
    status: partial
    confidence: derived
    source: >
      [해외 앵커] MS Sentinel은 주요 SIEM 중 가격을 공개하는 거의 유일한 벤더.
      PAYG $4.30(US East)~$5.59(US West), 100GB/day 약정 $2.96, 50,000GB/day $2.05.
      90일 초과 보관 $0.10/GB/월. 데이터레이크 수집 $0.05/GB, 저장 $0.026/GB/월.
      [참고] Splunk 약 $1,000/GB/년(50GB 구간), Elastic $0.55~1.10/GB (제3자 추정).
    source_url: "https://siemcostcalculator.com/sentinel-pricing"
    source_url_2: "https://realm.security/siem-pricing-2026-leading-siem-providers-compared/"
    retrieved: "2026-09-03"
    note: >
      [국내가 확보 불가 확정 → 역산 전환]
      base=4.30은 Sentinel PAYG 최저 리전(US East) 기준. low=100GB/day 약정가, high=최고 리전(US West).
      나라장터 보안관제 제안요청서 5건(대검찰청·한국은행·KLID·보건복지부·울산과기원) 전수 확인 결과
      GB/EPS 등 데이터 볼륨 지표가 전무. 원인은 두 가지.
      (1) 「행정기관 및 공공기관 정보시스템 구축·운영 지침」 제17조에 따라 시스템 현황이 비공개.
          제안요청서에 해당 절은 존재하나 "보안상 생략, 방문·보안서약서 제출 후 열람 가능"으로 대체됨.
      (2) 국내 계약 단위가 GB가 아니라 인력(명). managed_siem_kr_per_person 항목 참조.
