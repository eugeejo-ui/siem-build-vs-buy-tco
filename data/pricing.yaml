    confidence: official
    source: "KISA 정보보호 공시 종합 포털 (무신사 2026 의무=1.5%, 11번가 2026 의무=7.1%)"
    source_url: "https://isds.kisa.or.kr/kr/publish/list.do?menuNo=204942"
    retrieved: "2026-09-02"
    note: >
      상한 앵커를 위메프(9.8%, 2024 정산사태)에서 11번가로 교체.
      대형사 쿠팡 8.9%는 대조 사례. 6개사 비교 상세는 phase01 부록 A.

  outsourcing_ratio:
    name: "보안 인력 중 외주 비중"
    low: 0
    base: null
    high: 59
    unit: "%"
    status: confirmed
    confidence: official
    source: "KISA 정보보호 공시 6개사 실측 (무신사 0% ~ 11번가 약 59%)"
    source_url: "https://isds.kisa.or.kr/kr/publish/list.do?menuNo=204942"
    retrieved: "2026-09-02"
    note: "연도별 변동 극심(예: SSG 2.2→43.2%). 민감도 파라미터로 처리."

  log_retention_days:
    name: "로그(접속기록) 법정 보관 기간"
    low: 730
    base: 730
    high: 730
    unit: "days"
    status: confirmed
    confidence: official
    source: "개인정보의 안전성 확보조치 기준 제8조 (현행 시행 2025-10-31, 고시 제2025-9호)"
    source_url: "https://www.law.go.kr/admRulLsInfoP.do?chrClsCd=010202&admRulSeq=2100000229672"
    retrieved: "2026-09-02"
    note: >
      5만명 이상 정보주체 또는 고유식별·민감정보 처리 시 적용. 법적 의무라 민감도 대상 아님.
