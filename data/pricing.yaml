# =============================================================================
# 가격 원장 (Pricing Ledger)
# 프로젝트: SIEM 자체 구축 vs 구매 총비용(TCO) 비교 분석
#
# 본 파일의 역할
#   계산에 투입되는 모든 숫자를 한곳에 모아 둔 파일입니다.
#   코드에는 숫자를 직접 적지 않으며, 값이 바뀌면 본 파일만 수정합니다.
#
# 작성 원칙 (phase00_scope.md 5절)
#   1. 값은 하나로 적지 않고 low / base / high 세 칸으로 적습니다.
#   2. 출처와 조회일을 함께 적습니다. 비어 있으면 아직 검증되지 않은 값입니다.
#   3. 확인이 불가능한 값은 역산(derived)으로 처리합니다.
# =============================================================================

meta:
  schema_version: "1.1"
  updated: "2026-09-03"
  base_currency: "KRW"

  # status : confirmed(확정) / partial(일부 확인) / pending(미착수)
  # confidence :
  #   official   공공·협회 공식 통계
  #   vendor     제조사 공개 자료 (편향 가능성 있음)
  #   thirdparty 제3자 조사기관
  #   derived    역산 처리 (원가 비공개 항목)
  #   assumption 근거 없는 가정값 (민감도 분석 필수)
  #   unverified 값은 있으나 출처 미확인

